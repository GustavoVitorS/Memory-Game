<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070707">
  <meta name="description" content="Um jogo da memória leve, responsivo e feito com HTML, CSS e JavaScript.">
  <title>Jogo da Memória</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>

<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <main class="game-shell">
    <header class="game-header">
      <div class="heading">
        <p class="eyebrow"><span aria-hidden="true"></span> DESAFIO DE MEMÓRIA</p>
        <h1>Encontre os <em>pares.</em></h1>
        <p id="game-status" class="game-status" aria-live="polite">Memorize as cartas antes de começar.</p>
      </div>

      <button class="restart-button" type="button" data-restart aria-label="Reiniciar jogo">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 7v5h-5M4 17v-5h5M6.1 9a7 7 0 0 1 11.5-2.6L20 9M4 15l2.4 2.6A7 7 0 0 0 18 15"/>
        </svg>
        Reiniciar
      </button>
    </header>

    <section class="scoreboard" aria-label="Placar da rodada">
      <div class="stat">
        <span class="stat-label">JOGADAS</span>
        <strong id="moves">00</strong>
      </div>
      <div class="stat stat-featured">
        <span class="stat-label">PARES</span>
        <strong><span id="pairs">0</span><small>/6</small></strong>
      </div>
      <div class="stat">
        <span class="stat-label">TEMPO</span>
        <strong id="timer">00:00</strong>
      </div>
    </section>

    <section class="board-wrap" aria-label="Área do jogo">
      <div id="game-board" class="game-board" aria-describedby="game-status"></div>
    </section>

    <footer class="game-footer">
      <p><span aria-hidden="true">●</span> Selecione duas cartas para formar um par</p>
      <p>6 pares • 12 cartas</p>
    </footer>
  </main>

  <div id="win-dialog" class="win-dialog" role="dialog" aria-modal="true" aria-labelledby="win-title" hidden>
    <div class="win-card">
      <div class="trophy" aria-hidden="true">✓</div>
      <p class="eyebrow">DESAFIO CONCLUÍDO</p>
      <h2 id="win-title">Memória afiada!</h2>
      <p>Você encontrou todos os pares em <strong id="final-moves">0 jogadas</strong> e <strong id="final-time">00:00</strong>.</p>
      <button class="play-again-button" type="button" data-restart>Jogar novamente</button>
    </div>
  </div>
</body>
</html>
